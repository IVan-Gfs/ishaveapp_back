<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Cadastro|IshaveApp</title>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>

</head>
<body>
    <h1 id="result"></h1>
    <script>
        function getParams(url){
            const params = new URLSearchParams(url.search)
            const encryptedData = params.get('d');
            const iv = params.get('v');
            return {encryptedData, iv}
        }

        function sendRequest(){
            const url = new URL(window.location.href)
            const {encryptedData,iv} =  getParams(url)
            const endpoint = `http://localhost:8081/confirmMail?d=${encryptedData}&v=${iv}`;
            
            const options = {
                method: 'GET',
                headers: {
                    'Content-Type':'application/json'
                }
            }

            fetch(endpoint,options).then( res => res.json()).then(data=>{
                if(data.message){
                   const h1 = document.getElementById('result');
                   h1.innerHTML = data.registered ? data.message+'<a href="loginFicticio.html">login</a>.' : data.message
                }
            }).catch(error =>{
                console.log('Ocorreu um erro na requisição: '+error)
            })
            
        }
        window.onload = sendRequest;
        
    </script>
</body>
</html>
